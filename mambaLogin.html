<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mamba Login</title>
<style>
body {
  background: linear-gradient(135deg, #3c4b37, #000);
  font-family: Arial;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}
.login-box {
  background: white;
  padding: 40px;
  border-radius: 20px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border-radius: 8px;
  border: 1px solid #ccc;
}
button {
  background: #3c4b37;
  color: white;
  border: none;
  padding: 12px;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>Acceso privado</h2>
  <input id="user" placeholder="Usuario">
  <input id="pass" type="password" placeholder="Contraseña">
  <button onclick="login()">Entrar</button>
</div>

<script>
const USER = "biologa";
const PASS = "clave123";

function login() {
  if (user.value === USER && pass.value === PASS) {
    localStorage.setItem("admin", "true");
    window.location.href = "mambaPanel.html";
  } else {
    alert("Credenciales incorrectas");
  }
}
</script>

</body>
</html>
