<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mamba Panel</title>
<style>
body {
  font-family: Arial;
  background: #f4f4f4;
  padding: 40px;
  margin: 0;
}
.card {
  background: white;
  padding: 30px;
  border-radius: 20px;
  max-width: 1100px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.2);
}
h2 {
  color: #3c4b37;
  margin-top: 0;
}
h3 {
  margin-top: 30px;
  color: #3c4b37;
}
input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 6px 0 16px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
button {
  background: #3c4b37;
  color: white;
  border: none;
  padding: 10px 16px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  margin-right: 6px;
}
button.secondary {
  background: #333;
}
button.delete {
  background: #b00020;
}
.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logout {
  background: black;
}
.preview-img {
  width: 120px;
  margin-top: 10px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,.3);
}
.alumno-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f9f9f9;
  border-radius: 12px;
  padding: 10px 14px;
  margin-bottom: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,.1);
}
.alumno-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1;
}
.alumno-item img {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  object-fit: cover;
}
.alumno-info {
  font-size: 0.9rem;
}
.tabs {
  display: flex;
  gap: 10px;
  margin: 20px 0;
}
.tabs button {
  background: #ddd;
  color: black;
}
.tabs button.active {
  background: #3c4b37;
  color: white;
}
.section {
  display: none;
}
.section.active {
  display: block;
}
hr {
  margin: 30px 0;
}
</style>
</head>
<body>

<div class="card">

  <div class="top-bar">
    <h2>Mamba Panel (Administrador)</h2>
    <button class="logout" onclick="logout()">Cerrar sesión</button>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button id="tabPortada" class="active" onclick="showSection('portada')">Portada</button>
    <button id="tabAlumnos" onclick="showSection('alumnos')">Alumnos</button>
  </div>

  <!-- ================= PORTADA ================= -->
  <div id="portada" class="section active">
    <h3>Editar portada</h3>

    <input id="title" placeholder="Título">
    <input id="subtitle" placeholder="Subtítulo">
    <textarea id="description" placeholder="Descripción"></textarea>
    <input id="buttonText" placeholder="Texto botón">

    <h3>Carousel</h3>
    <input type="file" id="carousel1" accept="image/*">
    <img id="prev1" class="preview-img">
    <input type="file" id="carousel2" accept="image/*">
    <img id="prev2" class="preview-img">
    <input type="file" id="carousel3" accept="image/*">
    <img id="prev3" class="preview-img">

    <h3>Collage</h3>
    <input type="file" id="collage1" accept="image/*">
    <img id="cprev1" class="preview-img">
    <input type="file" id="collage2" accept="image/*">
    <img id="cprev2" class="preview-img">
    <input type="file" id="collage3" accept="image/*">
    <img id="cprev3" class="preview-img">

    <button onclick="guardarPortada()">Guardar portada</button>
  </div>

  <!-- ================= ALUMNOS ================= -->
  <div id="alumnos" class="section">
    <h3 id="formTitle">Agregar alumno</h3>

    <input id="nombre" placeholder="Nombre completo">
    <input id="matricula" placeholder="Matrícula">
    <input id="programa" placeholder="Programa">
    <input id="correo" placeholder="Correo">
    <input id="generacion" placeholder="Generación (ej: 2021 - 2025)">

    <select id="tipo">
      <option value="vigentes">Alumno vigente</option>
      <option value="egresados">Alumno egresado</option>
    </select>

    <input type="file" id="fotoInput" accept="image/*">
    <img id="preview" class="preview-img" style="display:none">

    <button onclick="guardarAlumno()">Guardar alumno</button>
    <button onclick="cancelarAlumno()" id="cancelBtn" style="display:none" class="secondary">Cancelar</button>

    <hr>

    <h3>Alumnos vigentes</h3>
    <div id="lista-vigentes"></div>

    <h3 style="margin-top:30px">Alumnos egresados</h3>
    <div id="lista-egresados"></div>
  </div>

</div>

<script>
// ===================== SEGURIDAD =====================
if (!localStorage.getItem("admin")) {
  window.location.href = "mambaLogin.html";
}

// ===================== TABS =====================
function showSection(section) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active"));

  document.getElementById(section).classList.add("active");
  document.getElementById("tab" + capitalize(section)).classList.add("active");
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

// ===================== PORTADA =====================
const defaults = {
  title: "DRA. MIREYA BURGOS",
  subtitle: "Profesora Investigadora",
  description: "Investigadora Nacional Nivel I, especializada en sistemática, evolución y genética de poblaciones de plantas.",
  buttonText: "Leer más"
};

title.value = localStorage.getItem("title") || defaults.title;
subtitle.value = localStorage.getItem("subtitle") || defaults.subtitle;
description.value = localStorage.getItem("description") || defaults.description;
buttonText.value = localStorage.getItem("buttonText") || defaults.buttonText;

["carousel1","carousel2","carousel3"].forEach((k,i)=>{
  if(localStorage.getItem(k)) document.getElementById("prev"+(i+1)).src = localStorage.getItem(k);
});
["collage1","collage2","collage3"].forEach((k,i)=>{
  if(localStorage.getItem(k)) document.getElementById("cprev"+(i+1)).src = localStorage.getItem(k);
});

function bindImage(inputId, key, previewId) {
  const input = document.getElementById(inputId);
  const preview = document.getElementById(previewId);
  input.addEventListener("change", e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      localStorage.setItem(key, reader.result);
      preview.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

bindImage("carousel1","carousel1","prev1");
bindImage("carousel2","carousel2","prev2");
bindImage("carousel3","carousel3","prev3");
bindImage("collage1","collage1","cprev1");
bindImage("collage2","collage2","cprev2");
bindImage("collage3","collage3","cprev3");

function guardarPortada() {
  localStorage.setItem("title", title.value);
  localStorage.setItem("subtitle", subtitle.value);
  localStorage.setItem("description", description.value);
  localStorage.setItem("buttonText", buttonText.value);
  alert("Portada guardada");
}

// ===================== ALUMNOS =====================
let alumnosVigentes = JSON.parse(localStorage.getItem("alumnosVigentes")) || [];
let alumnosEgresados = JSON.parse(localStorage.getItem("alumnosEgresados")) || [];

let editIndex = null;
let editTipo = null;
let nuevaFoto = null;

renderAlumnos();

// Imagen preview
fotoInput.addEventListener("change", e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    nuevaFoto = reader.result;
    preview.src = reader.result;
    preview.style.display = "block";
  };
  reader.readAsDataURL(file);
});

function renderAlumnos() {
  renderLista("vigentes", alumnosVigentes);
  renderLista("egresados", alumnosEgresados);
}

function renderLista(tipo, lista) {
  const cont = document.getElementById(`lista-${tipo}`);
  cont.innerHTML = "";

  lista.forEach((a, i) => {
    const div = document.createElement("div");
    div.className = "alumno-item";
    div.innerHTML = `
      <div class="alumno-left">
        <img src="${a.foto}">
        <div class="alumno-info">
          <strong>${a.nombre}</strong><br>
          ${a.programa} · ${a.generacion}
        </div>
      </div>
      <div>
        <button class="secondary" onclick="editarAlumno('${tipo}', ${i})">Editar</button>
        <button class="delete" onclick="eliminarAlumno('${tipo}', ${i})">Eliminar</button>
      </div>
    `;
    cont.appendChild(div);
  });
}

function guardarAlumno() {
  if (!nombre.value || !programa.value) {
    alert("Completa al menos nombre y programa");
    return;
  }

  const alumno = {
    nombre: nombre.value,
    matricula: matricula.value,
    programa: programa.value,
    correo: correo.value,
    generacion: generacion.value,
    foto: nuevaFoto || "imagenesAlumnos/default.png"
  };

  const tipo = document.getElementById("tipo").value;

  if (editIndex !== null) {
    const lista = editTipo === "vigentes" ? alumnosVigentes : alumnosEgresados;
    if (!nuevaFoto) alumno.foto = lista[editIndex].foto;
    lista[editIndex] = alumno;
  } else {
    if (tipo === "vigentes") alumnosVigentes.push(alumno);
    else alumnosEgresados.push(alumno);
  }

  persistirAlumnos();
  resetAlumnoForm();
  renderAlumnos();
}

function editarAlumno(tipo, index) {
  const lista = tipo === "vigentes" ? alumnosVigentes : alumnosEgresados;
  const a = lista[index];

  nombre.value = a.nombre;
  matricula.value = a.matricula;
  programa.value = a.programa;
  correo.value = a.correo;
  generacion.value = a.generacion;
  document.getElementById("tipo").value = tipo;

  preview.src = a.foto;
  preview.style.display = "block";

  editIndex = index;
  editTipo = tipo;
  nuevaFoto = null;

  formTitle.textContent = "Editar alumno";
  cancelBtn.style.display = "inline-block";
}

function eliminarAlumno(tipo, index) {
  if (!confirm("¿Eliminar alumno?")) return;
  const lista = tipo === "vigentes" ? alumnosVigentes : alumnosEgresados;
  lista.splice(index, 1);
  persistirAlumnos();
  renderAlumnos();
}

function cancelarAlumno() {
  resetAlumnoForm();
}

function resetAlumnoForm() {
  nombre.value = "";
  matricula.value = "";
  programa.value = "";
  correo.value = "";
  generacion.value = "";
  tipo.value = "vigentes";
  fotoInput.value = "";
  preview.style.display = "none";

  editIndex = null;
  editTipo = null;
  nuevaFoto = null;

  formTitle.textContent = "Agregar alumno";
  cancelBtn.style.display = "none";
}

function persistirAlumnos() {
  localStorage.setItem("alumnosVigentes", JSON.stringify(alumnosVigentes));
  localStorage.setItem("alumnosEgresados", JSON.stringify(alumnosEgresados));
}

// ===================== LOGOUT =====================
function logout() {
  localStorage.removeItem("admin");
  window.location.href = "mambaLogin.html";
}
</script>

</body>
</html>
