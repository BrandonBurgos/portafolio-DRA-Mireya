<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Alumnos Vigentes</title>
  <link rel="stylesheet" href="estilosA.css">
</head>

<body class="bodyA">

<!-- NAVBAR -->
<nav class="navbar">
  <div class="logo-left">
    <img src="imagenesIndex/logo1.png" alt="Logo 1">
  </div>

  <div class="menu">
    <ul>
      <li><a href="index.html">Inicio</a></li>
      <li><a href="cursos.html">Cursos</a></li>
      <li><a href="alumnos.html" class="active">Alumnos</a></li>
      <li><a href="#">LGAC-CP</a></li>
      <li><a href="#">Publicaciones</a></li>
      <li><a href="#" class="language-btn"><span id="lang-text">ES</span></a></li>
    </ul>
  </div>

  <div class="logo-right">
    <img src="imagenesIndex/logo2.png" alt="Logo 2">
    <img src="imagenesIndex/logo3.png" alt="Logo 3">
  </div>
</nav>

<!-- HEADER -->
<header class="header-alumnos">
  <h1 id="titulo">Alumnos Vigentes</h1>
</header>

<!-- CONTENEDOR -->
<main class="alumnos-container" id="lista-alumnos"></main>

<script>
document.addEventListener("DOMContentLoaded", () => {

  const contenedor = document.getElementById("lista-alumnos");

  const alumnosDefault = [
    {
      nombre: "Juan Pérez López",
      matricula: "20210001",
      programa: "Ingeniería en Sistemas",
      correo: "juan.perez@correo.com",
      generacion: "2021 - 2025",
      foto: "imagenesAlumnos/persona1.jpg"
    },
    {
      nombre: "María González Ruiz",
      matricula: "20210002",
      programa: "Ingeniería Industrial",
      correo: "maria.gonzalez@correo.com",
      generacion: "2021 - 2025",
      foto: "imagenesAlumnos/persona2.jpg"
    },
    {
      nombre: "Carlos Hernández Soto",
      matricula: "20210003",
      programa: "Ciencias Computacionales",
      correo: "carlos.hernandez@correo.com",
      generacion: "2022 - 2026",
      foto: "imagenesAlumnos/persona3.jpg"
    }
  ];

  let alumnos = JSON.parse(localStorage.getItem("alumnosVigentes")) || alumnosDefault;

  alumnos.forEach(alumno => {
    const section = document.createElement("section");
    section.className = "alumno";

    section.innerHTML = `
      <div class="alumno-foto">
        <img src="${alumno.foto}" alt="${alumno.nombre}">
        <span class="nombre">${alumno.nombre}</span>
      </div>

      <div class="alumno-info">
        <p><strong>Matrícula:</strong> ${alumno.matricula}</p>
        <p><strong>Programa:</strong> ${alumno.programa}</p>
        <p><strong>Correo:</strong> ${alumno.correo}</p>
        <p><strong>Generación:</strong> ${alumno.generacion}</p>
      </div>
    `;

    contenedor.appendChild(section);
  });

});
</script>

</body>
</html>
